name: Bash script checks and Docker build and push

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: Lint and syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Syntax check
        run: |
          for shell_script in *.sh; do
            if [ -f "$shell_script" ]; then
              echo "Checking syntax for $shell_script..."
              bash -n "$shell_script"
            fi
          done

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          format: tty

  build-and-push:
    name: Build and push Docker Image
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract script version
        id: vars
        run: echo "version=$(grep '^readonly VERSION=' end-of-life.sh | cut -d'\"' -f2)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/end-of-life-cli:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/end-of-life-cli:${{ steps.vars.outputs.version }}
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ steps.vars.outputs.version }}
